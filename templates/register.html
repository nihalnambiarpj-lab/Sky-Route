{% extends "base.html" %}
{% block title %}Sign up — SkyRoute{% endblock %}
{% block content %}

<section class="auth-page">
  <form class="auth-card" method="POST" action="{{ url_for('register') }}">
    <div class="pass-head">
      <span class="mark">SkyRoute</span>
      <span class="label">New Member</span>
    </div>
    <h1>Create your account</h1>

    <label for="full_name">Full name</label>
    <input type="text" id="full_name" name="full_name" required autofocus>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" minlength="8" required>

    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>

    <button type="submit" class="search-btn">Sign up</button>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </form>
</section>

{% endblock %}
